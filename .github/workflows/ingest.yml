name: Ingest RemoteOK jobs

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      demo_llm_fallback:
        description: Test one Gemini fallback with a synthetic record (not stored)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: remoteok-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      LLM_FALLBACK_ENABLED: "true"
      LLM_FALLBACK_PROVIDER: "gemini"
      LLM_FALLBACK_MODEL: "gemini-3.5-flash-lite"
      LLM_FALLBACK_MAX_CALLS: "5"
      DEMO_INJECT_INVALID_RECORD: ${{ github.event.inputs.demo_llm_fallback == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run ingestion
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Add DATABASE_URL as a repository Actions secret before running ingestion."
            exit 1
          fi
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::error::Add GEMINI_API_KEY as a repository Actions secret before running ingestion."
            exit 1
          fi
          python -m src.pipeline
