name: Ingest RemoteOK jobs

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: remoteok-ingestion
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      LLM_FALLBACK_ENABLED: "false"
      DEMO_INJECT_INVALID_RECORD: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run ingestion
        run: |
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::Add DATABASE_URL as a repository Actions secret before running ingestion."
            exit 1
          fi
          python -m src.pipeline
