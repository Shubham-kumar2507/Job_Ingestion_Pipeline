[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "job-ingestion-mvp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "groq>=0.20,<1.0",
    "httpx>=0.27,<1.0",
    "jinja2>=3.1,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7,<3.0",
    "python-dotenv>=1.0,<2.0",
    "SQLAlchemy>=2.0,<3.0",
    "tenacity>=8.2,<10.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[tool.vercel]
entrypoint = "src.dashboard:app"
